
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <h1>Employee Management System</h1>
    <p>Spring Boot &middot; Thymeleaf &middot; H2 Database</p>
</header>

<main class="container">

    <div class="alert success"
         th:if="${success}"
         th:text="${success}"></div>

    <div class="alert danger"
         th:if="${error}"
         th:text="${error}"></div>

    <!-- CREATE: Employee form -->
    <section class="card">
        <h2>Register an Employee</h2>

        <form th:action="@{/employees}"
              th:object="${employee}"
              method="post"
              novalidate>

            <div th:replace="~{employee-fields :: fields}"></div>

            <button type="submit" class="btn primary">
                Save Employee
            </button>
        </form>
    </section>

    <!-- READ: Employee table -->
    <section class="card">
        <h2>
            Registered Employees
            <span class="badge"
                  th:text="${#lists.size(employees)}">0</span>
        </h2>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Age</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="7" class="empty">
                        No employees registered yet.
                    </td>
                </tr>

                <tr th:each="e : ${employees}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.fullName}"></td>
                    <td th:text="${e.email}"></td>
                    <td th:text="${e.phone}"></td>
                    <td th:text="${e.department}"></td>
                    <td th:text="${e.age}"></td>

                    <td class="actions">
                        <!-- UPDATE -->
                        <a class="btn small"
                           th:href="@{/employees/{id}/edit(id=${e.id})}">
                            Edit
                        </a>

                        <!-- DELETE -->
                        <form th:action="@{/employees/{id}/delete(id=${e.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this employee?');">

                            <button type="submit"
                                    class="btn small danger">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer class="footer">
    COSC 32133 / BECS 32263 &middot; Lab Sheet 04
</footer>

</body>
</html>
